<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Registration Successful</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f4">
    <tr>
      <td align="center" style="padding: 20px;">
        <table width="500" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width:500px; width:100%; border-collapse: collapse; border-radius:8px; overflow:hidden; font-family: Arial, sans-serif;">
          <tr>
            <td align="center" style="padding: 20px 0; background-color:#a500e6;">
              <img src="{{ logo_url }}" alt="Your Company Logo" width="120" style="display:block; border:none; outline:none; text-decoration:none;" />

          </tr>
          <tr>
            <td style="padding: 30px 40px 10px 40px; color:#333333; font-size:18px; font-weight:bold;">

          </tr>
          <tr>
            <td style="padding: 0 40px 30px 40px; color:#555555; font-size:16px; line-height:1.5;">
              Your account has been registered successfully! We're excited to have you onboard.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding: 15px 40px 30px 40px; color:#999999; font-size:12px;">
              &copy; {{ current_year }} Your Company. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
